<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Crunch Time Kitchen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf5ea;--card:#fffdf8;--ink:#2b1d12;--muted:#76624f;--line:#eadbc4;--orange:#e8641c;--orange-d:#c24e10;--green:#2f7d4a;--green-l:#e5f2e7;--red:#b3261e;--red-l:#fbe4e1;--chip:#fbe7d6;--amber-l:#fff1d6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:800;line-height:1.1}
.logo{font-family:Fraunces,serif;font-weight:800;font-size:22px}
.logo span{color:var(--orange)}
button,input{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;font-weight:700;cursor:pointer;text-decoration:none}
.btn-main{background:var(--ink);color:#fff}
.btn-main:disabled{opacity:.5;cursor:default}
.btn-line{background:transparent;border:1.5px solid var(--line);color:var(--ink);padding:9px 14px;font-size:14px}
.field{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.field:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-l)}

/* Lock screen */
#lock{min-height:100vh;display:flex;align-items:center}
.lockbox{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;width:100%;max-width:380px;margin:0 auto;box-shadow:0 8px 24px rgba(60,30,0,.08);display:grid;gap:14px}
.lockbox h1{font-size:28px}
.lockbox p{color:var(--muted);font-size:15px}
.err{color:var(--red);font-size:14px;min-height:20px}

/* Panel */
#panel{display:none;padding-bottom:110px}
.top{position:sticky;top:0;z-index:5;background:rgba(251,245,234,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.top a{font-size:14px;color:var(--muted)}
.head{padding:22px 0 8px}
.head h1{font-size:30px}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:500;padding:7px 12px;border-radius:999px}
.status.live{background:var(--green-l);color:var(--green)}
.status.stale{background:var(--amber-l);color:#8a5a00}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.box h2{font-family:"DM Sans",sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.switch b{display:block}
.switch small{color:var(--muted)}
.switch input{appearance:none;width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.switch input:checked{background:var(--red)}
.switch input:checked::after{left:25px}
.count{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:14px}
.count span{padding:5px 10px;border-radius:999px;background:var(--chip)}
.count .t{background:var(--green-l);color:var(--green);font-weight:700}
.count .o{background:var(--red-l);color:var(--red);font-weight:700}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item img,.item .em{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:26px}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-size:15px;line-height:1.25}
.item .nm small{color:var(--muted);font-size:13px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;padding:8px 10px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted);min-width:46px}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"][data-v="today"]{background:var(--green);color:#fff}
.seg button[aria-pressed="true"][data-v=""]{background:var(--ink);color:#fff}
.seg button[aria-pressed="true"][data-v="off"]{background:var(--red);color:#fff}
.item.is-off .nm b{text-decoration:line-through;color:var(--muted)}
@media(max-width:420px){.seg button{padding:8px 7px;min-width:40px;font-size:12px}.item img,.item .em{width:44px;height:44px}}

.savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(251,245,234,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.savebar .wrap{display:flex;align-items:center;gap:12px}
.savebar .btn-main{flex:1;padding:15px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--green);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--red)}
</style>
</head>
<body>

<div id="lock">
  <form class="lockbox" id="lockForm" autocomplete="off">
    <div class="logo">Crunch <span>Time</span></div>
    <h1>Kitchen admin</h1>
    <p>Enter the passcode to set today's menu.</p>
    <input class="field" id="pass" type="password" inputmode="numeric" placeholder="Passcode" aria-label="Passcode" required>
    <button class="btn btn-main" id="unlockBtn" type="submit">Unlock</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<div id="panel">
  <header class="top"><div class="wrap">
    <div class="logo">Crunch <span>Time</span></div>
    <a href="/" target="_blank" rel="noopener">View menu ↗</a>
  </div></header>

  <div class="wrap">
    <div class="head">
      <h1 id="todayH">Today</h1>
      <div class="status" id="status"></div>
    </div>

    <div class="box">
      <label class="switch">
        <span><b>Kitchen closed today</b><small>Menu shows "Closed today, pre-order for tomorrow"</small></span>
        <input type="checkbox" id="closed">
      </label>
    </div>

    <div class="box">
      <h2>Today's note (optional)</h2>
      <input class="field" id="note" maxlength="160" placeholder="e.g. Fresh batch at 5 PM · Order by 3 PM">
    </div>

    <div class="box">
      <h2>What are we serving today?</h2>
      <div class="count" id="count"></div>
      <div class="quick">
        <button class="btn btn-line" type="button" id="restOff">Mark the rest "Not today"</button>
        <button class="btn btn-line" type="button" id="clearAll">Clear all</button>
      </div>
      <div id="list"></div>
    </div>
    <p style="color:var(--muted);font-size:13px;margin:14px 4px 0">⭐ <b>Today</b> = shown in "Offer today" at the top. ✕ <b>Not today</b> = greyed out, "Pre-order" for tomorrow. Choices reset at midnight; press Save each day.</p>
  </div>

  <div class="savebar"><div class="wrap">
    <button class="btn btn-main" id="save" type="button">Save &amp; publish</button>
  </div></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="menu.js"></script>
<script>
const {MENU, istDate, prettyDate} = window.CT;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let pass = "";
let sel = {};          // id -> "today" | "off"
let saved = null;      // last saved state from server

try { pass = sessionStorage.getItem("ct_pass") || ""; } catch (e) {}

async function api(body) {
  const r = await fetch("/api/today", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({passcode: pass, ...body})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || "Something went wrong"), {status: r.status});
  return j;
}

async function unlock() {
  $("unlockBtn").disabled = true; $("err").textContent = "";
  try {
    const j = await api({check: true});
    try { sessionStorage.setItem("ct_pass", pass); } catch (e) {}
    load(j.state);
    $("lock").style.display = "none"; $("panel").style.display = "block";
  } catch (e) {
    try { sessionStorage.removeItem("ct_pass"); } catch (x) {}
    $("err").textContent = e.status === 401 ? "Wrong passcode. Try again." : "Could not connect. Check internet and retry.";
    $("pass").value = ""; $("pass").focus();
  } finally { $("unlockBtn").disabled = false; }
}

function load(state) {
  saved = state;
  sel = {...(state.items || {})};
  $("closed").checked = !!state.closed;
  $("note").value = state.note || "";
  $("todayH").textContent = "Today · " + prettyDate(istDate());
  renderStatus(); renderList();
}

function renderStatus() {
  const el = $("status");
  if (saved && saved.date === istDate()) {
    const t = new Date(saved.updatedAt).toLocaleTimeString("en-IN", {hour:"numeric", minute:"2-digit", timeZone:"Asia/Kolkata"});
    el.className = "status live"; el.textContent = "● Live on the menu · saved " + t;
  } else {
    el.className = "status stale";
    el.textContent = saved && saved.date ? `Last saved ${prettyDate(saved.date)}. Not live today. Press Save.` : "Nothing saved yet. Pick items and press Save.";
  }
}

function renderList() {
  $("list").innerHTML = MENU.map(d => {
    const v = sel[d.id] || "";
    return `<div class="item${v === "off" ? " is-off" : ""}" data-id="${d.id}">
      ${d.img ? `<img src="img/${d.img}.jpg" alt="" loading="lazy">` : `<span class="em">${d.emoji}</span>`}
      <div class="nm"><b>${esc(d.n)}</b><small>${esc(d.p)} · ₹${d.r}</small></div>
      <div class="seg" role="group" aria-label="${esc(d.n)}">
        <button type="button" data-v="today" aria-pressed="${v === "today"}" title="Serving today">⭐</button>
        <button type="button" data-v="" aria-pressed="${v === ""}" title="Normal">–</button>
        <button type="button" data-v="off" aria-pressed="${v === "off"}" title="Not today">✕</button>
      </div></div>`;
  }).join("");
  const n = s => Object.values(sel).filter(v => v === s).length;
  $("count").innerHTML = `<span class="t">⭐ ${n("today")} today</span><span class="o">✕ ${n("off")} not today</span><span>${MENU.length - n("today") - n("off")} normal</span>`;
}

$("list").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]"); if (!b) return;
  const id = b.closest(".item").dataset.id;
  if (b.dataset.v) sel[id] = b.dataset.v; else delete sel[id];
  renderList();
});
$("restOff").onclick = () => { MENU.forEach(d => { if (sel[d.id] !== "today") sel[d.id] = "off"; }); renderList(); };
$("clearAll").onclick = () => { sel = {}; renderList(); };

function toast(msg, bad) {
  const t = $("toast"); t.textContent = msg; t.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(t._h); t._h = setTimeout(() => t.className = "toast" + (bad ? " bad" : ""), 2600);
}

$("save").onclick = async () => {
  const btn = $("save"); btn.disabled = true; btn.textContent = "Saving…";
  try {
    const j = await api({state: {items: sel, note: $("note").value.trim(), closed: $("closed").checked}});
    saved = j.state; renderStatus();
    toast("Saved ✓ Live on the menu in a minute");
  } catch (e) {
    if (e.status === 401) { toast("Passcode expired. Unlock again.", true); setTimeout(() => location.reload(), 1500); }
    else toast("Could not save. Try again.", true);
  } finally { btn.disabled = false; btn.textContent = "Save & publish"; }
};

$("lockForm").addEventListener("submit", e => { e.preventDefault(); pass = $("pass").value.trim(); unlock(); });
if (pass) unlock(); else $("pass").focus();
</script>
</body>
</html>
